name: PatchPilot IBM Cloud Production Deployment

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      REGISTRY: icr.io
      REGION: us-south
      NAMESPACE: patchpilot
      APP_NAME: patchpilot
      IAM_URL: https://iam.cloud.ibm.com
      PROJECT_ID: ${{ secrets.IBM_CLOUD_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: test -f Dockerfile || (echo "Dockerfile missing" && exit 1)

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login IBM Registry
        uses: docker/login-action@v3
        with:
          registry: icr.io
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            icr.io/${{ env.NAMESPACE }}/${{ env.APP_NAME }}:latest
            icr.io/${{ env.NAMESPACE }}/${{ env.APP_NAME }}:${{ github.sha }}

      - name: Generate IAM Token
        run: |
          TOKEN=$(curl -s -X POST "${IAM_URL}/identity/token" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=${{ secrets.IBM_CLOUD_API_KEY }}" \
          | jq -r '.access_token')

          echo "IAM_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Deploy to Code Engine
        run: |
          curl -X POST \
          "https://api.${REGION}.codeengine.cloud.ibm.com/v2/projects/${PROJECT_ID}/applications/${APP_NAME}/revisions" \
          -H "Authorization: Bearer $IAM_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "image": "icr.io/'${NAMESPACE}'/'${APP_NAME}':'${GITHUB_SHA}'",
            "port": 3000
          }'
