name: PatchPilot IBM Cloud Production Deployment

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      REGISTRY: icr.io
      NAMESPACE: patchpilot
      APP_NAME: patchpilot
      IAM_URL: https://iam.cloud.ibm.com

    steps:
      # --------------------------
      # Checkout code
      # --------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------
      # Validate Dockerfile
      # --------------------------
      - name: Verify Dockerfile
        run: |
          if [ ! -f "./Dockerfile" ]; then
            echo "::error::Dockerfile not found in root"
            exit 1
          fi
          echo "Dockerfile found"

      # --------------------------
      # Setup Buildx
      # --------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------
      # Login to IBM Container Registry
      # --------------------------
      - name: Login to IBM Container Registry
        uses: docker/login-action@v3
        with:
          registry: icr.io
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      # --------------------------
      # Generate IAM Token
      # --------------------------
      - name: Generate IAM Token
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -s -X POST "${IAM_URL}/identity/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=${{ secrets.IBM_CLOUD_API_KEY }}")

          TOKEN=$(echo $RESPONSE | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "::error::Failed to generate IAM token"
            exit 1
          fi

          echo "IAM_TOKEN=$TOKEN" >> $GITHUB_ENV

      # --------------------------
      # Build & Push Docker Image
      # --------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            icr.io/patchpilot/patchpilot:latest
            icr.io/patchpilot/patchpilot:${{ github.sha }}

      # --------------------------
      # Deploy to IBM Code Engine
      # --------------------------
      - name: Deploy to Code Engine
        shell: bash
        run: |
          set -e

          CE_API="https://api.us-south.codeengine.cloud.ibm.com"

          echo "Deploying PatchPilot to Code Engine..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "$CE_API/v2/projects/${{ secrets.IBM_CLOUD_PROJECT_ID }}/applications/patchpilot" \
            -H "Authorization: Bearer $IAM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"image_reference\": \"icr.io/patchpilot/patchpilot:${{ github.sha }}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Deployment failed"
            exit 1
          fi

          echo "Deployment successful"
