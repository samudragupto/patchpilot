name: PatchPilot IBM Cloud Production Deployment

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      REGISTRY: icr.io
      REGION: global
      NAMESPACE: patchpilot   # your IBM namespace (you said it's global)
      IAM_URL: https://iam.cloud.ibm.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - Check Dockerfile
        run: |
          ls -al
          test -f Dockerfile || (echo "Dockerfile missing in root" && exit 1)

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # 🔥 FIX 1: correct IBM registry login
      - name: Login to IBM Container Registry
        uses: docker/login-action@v3
        with:
          registry: icr.io
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      # 🔥 FIX 2: IAM token
      - name: Generate IAM Token
        shell: bash
        run: |
          TOKEN=$(curl -s -X POST "${IAM_URL}/identity/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=${{ secrets.IBM_CLOUD_API_KEY }}" \
            | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "IAM token failed"
            exit 1
          fi

          echo "IAM_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 🔥 FIX 3: correct Docker build (IMPORTANT)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            icr.io/${{ env.NAMESPACE }}/patchpilot:latest
            icr.io/${{ env.NAMESPACE }}/patchpilot:${{ github.sha }}

      # 🔥 FIX 4: correct Code Engine endpoint handling
      - name: Trigger Code Engine Deployment
        shell: bash
        run: |
          set -euo pipefail

          CE_API="https://api.${{ vars.IBM_CLOUD_REGION }}.codeengine.cloud.ibm.com"

          curl -X POST \
            "$CE_API/v2/projects/${{ secrets.IBM_CLOUD_PROJECT_ID }}/applications/patchpilot/revisions" \
            -H "Authorization: Bearer $IAM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"image\": \"icr.io/${{ env.NAMESPACE }}/patchpilot:${{ github.sha }}\",
              \"port\": 3000
            }"

      - name: Success
        run: echo "PatchPilot deployed successfully"
