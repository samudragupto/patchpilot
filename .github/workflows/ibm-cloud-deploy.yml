name: PatchPilot IBM Cloud Production Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    # Ensure it only runs on push to main or when a PR is merged into main
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    
    # Environment variables for the job
    env:
      CONFIG_FOLDER: ${{ vars.CONFIG_FOLDER_PATH || 'configs' }}
      IBM_REGION: ${{ vars.IBM_CLOUD_REGION }}
      ICR_NAMESPACE: ${{ secrets.ICR_NAMESPACE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Configuration Changes
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: ${{ env.CONFIG_FOLDER }}/**

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to IBM Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: de.icr.io
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      - name: Generate IAM Token with Retries
        id: iam_token
        shell: bash
        run: |
          set -euo pipefail
          
          IAM_URL="${{ vars.IAM_URL }}"
          API_KEY="${{ secrets.IBM_CLOUD_API_KEY }}"
          
          if [ -z "$IAM_URL" ]; then
            echo "::error::IAM_URL is empty. Please set it in GitHub Variables."
            exit 1
          fi

          echo "Requesting IAM Token from: $IAM_URL/identity/token"
          
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            
            # Using -w to capture HTTP status code
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$IAM_URL/identity/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$API_KEY")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              TOKEN=$(echo "$BODY" | jq -r '.access_token // empty')
              if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
                echo "IAM_TOKEN=$TOKEN" >> $GITHUB_ENV
                echo "::add-mask::$TOKEN"
                echo "IAM token successfully generated."
                exit 0
              fi
            fi
            
            echo "::warning::Attempt $i failed. HTTP Status: $HTTP_CODE. Response: $BODY"
            if [ $i -lt 3 ]; then sleep 5; fi
          done
          
          echo "::error::All 3 attempts to generate IAM token failed."
          exit 1

      - name: Sync Project Configuration (Conditional)
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Changes detected in ${{ env.CONFIG_FOLDER }}. Syncing project..."
          
          SYNC_RESPONSE=$(curl -s -X POST \
            "${{ vars.PROJECTS_API_BASE_URL }}/v1/projects/${{ secrets.IBM_CLOUD_PROJECT_ID }}/sync" \
            -H "Authorization: Bearer $IAM_TOKEN" \
            -H "Content-Type: application/json")
          
          echo "Sync Response: $SYNC_RESPONSE"
          
          if [[ "$SYNC_RESPONSE" == *"error"* ]]; then
            echo "::error::Project sync failed."
            exit 1
          fi

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IBM_REGION }}.icr.io/${{ env.ICR_NAMESPACE }}/patchpilot:latest
            ${{ env.IBM_REGION }}.icr.io/${{ env.ICR_NAMESPACE }}/patchpilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Code Engine Deployment
        shell: bash
        run: |
          set -euo pipefail
          
          # Use provided CE API or fallback to region-based default
          CE_API="${{ vars.IBM_CLOUD_CODE_ENGINE_API || format('https://api.{0}.codeengine.cloud.ibm.com', env.IBM_REGION) }}"
          PROJECT_ID="${{ secrets.IBM_CLOUD_PROJECT_ID }}"
          
          echo "Updating Code Engine application 'patchpilot' at $CE_API..."
          
          DEPLOY_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$CE_API/v2/projects/$PROJECT_ID/applications/patchpilot/revisions" \
            -H "Authorization: Bearer $IAM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"image\": \"${{ env.IBM_REGION }}.icr.io/${{ env.ICR_NAMESPACE }}/patchpilot:${{ github.sha }}\",
              \"port\": 3000
            }")
          
          HTTP_CODE=$(echo "$DEPLOY_RESPONSE" | tail -n1)
          BODY=$(echo "$DEPLOY_RESPONSE" | head -n -1)
          
          echo "Deployment Response Status: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::Deployment failed with status $HTTP_CODE"
            exit 1
          fi
          
          echo "Successfully created new deployment revision."

      - name: Final Health Check & Verification
        run: |
          echo "Deployment successful for PatchPilot commit ${{ github.sha }}"
          echo "Pipeline completed with production safety checks."
